# set default shell
set -g default-shell /usr/bin/fish
set -g default-command /usr/bin/fish

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

# Change bindings for pane-splitting from " and % to | and -
unbind '"'
unbind %
bind | split-window -h
bind - split-window -v

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ============== Plugins =====================================
# gruvbox theme install via tmux-plugin-manager
set -g @plugin 'egel/tmux-gruvbox'
# set desired theme options...
set -g @tmux-gruvbox 'dark' # or 'dark256', 'light', 'light256'
# A collection of popup menus for managing your tmux environment. 
set -g @plugin 'jaclu/tmux-menus'
set -g @menus_trigger 'Space'
# An activity watcher for tmux
set -g @plugin 'akohlbecker/aw-watcher-tmux'
# tmux-autoreload watches your tmux configuration file and automatically reloads it on change.
set-option -g @plugin 'b0o/tmux-autoreload'
# ================= Tmux Plugin Manager =====================
# setup tmux-plugin-manager
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
bind I source-file  /usr/share/tmux-plugin-manager/tpm/bin/install_plugins
bind U source-file /usr/share/tmux-plugin-manager/tpm/update_plugins all
bind M-u source-file /usr/share/tmux-plugin-manager/tpm/clean_plugins

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '/usr/share/tmux-plugin-manager/tpm'
