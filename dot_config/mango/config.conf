# DankMaterialShell — MangoWM configuration (managed by `dms setup`)
# Keybinds, colors, layout, outputs, cursor and window rules are pulled from the
# ./dms fragments below. Add your own binds/rules here; they sit alongside DMS's.

env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland

# exec-once runs only at startup. Do NOT use exec= for the shell: mango re-runs
# every exec= on each config reload, and DMS reloads the config, which would
# spawn a new shell on every reload.
exec-once=dms run
exec-once=udiskie --tray

source=./dms/colors.conf
source=./dms/layout.conf
source=./dms/cursor.conf
source=./dms/outputs.conf
source=./dms/windowrules.conf
source=./dms/binds.conf

# ============================== 自定义设置 ========================================
# https://github.com/mangowm/mango/wiki
# https://mangowm-mango.mintlify.app/introduction

# 杂项
# Focus follows the mouse cursor.
sloppyfocus=0 # 焦点不跟随鼠标
# scroller_focus_center=1
cursor_hide_on_keypress=1
# drag_tile_to_tile=1
# drag_corner=3

# 自启动
exec-once=fcitx5 # 小企鹅输入法

# 大写键和 Ctrl 键交换
xkb_rules_options=ctrl:swapcaps

# ======================== 标签系统 ================================================
# tagrule=id:0,layout_name:grid # special
tagrule=id:1,layout_name:scroller # common
tagrule=id:2,layout_name:right_tile # code
tagrule=id:3,layout_name:fair # document
tagrule=id:4,layout_name:grid # misc
tagrule=id:5,layout_name:monocle # focus work

# bind=SUPER+ALT,1,view,1|3
# 移动并聚焦窗口到 tag
bind=SUPER+ALT,0,toggletag,0
bind=SUPER+ALT,1,toggletag,1
bind=SUPER+ALT,2,toggletag,2
bind=SUPER+ALT,3,toggletag,3
bind=SUPER+ALT,4,toggletag,4
bind=SUPER+ALT,5,toggletag,5
bind=SUPER+ALT,6,toggletag,6
bind=SUPER+ALT,7,toggletag,7
bind=SUPER+ALT,8,toggletag,8
bind=SUPER+ALT,9,toggletag,9
# 静默移动窗口到 tag
bind=SUPER+CTRL,0,tagsilent,0
bind=SUPER+CTRL,1,tagsilent,1
bind=SUPER+CTRL,2,tagsilent,2
bind=SUPER+CTRL,3,tagsilent,3
bind=SUPER+CTRL,4,tagsilent,4
bind=SUPER+CTRL,5,tagsilent,5
bind=SUPER+CTRL,6,tagsilent,6
bind=SUPER+CTRL,7,tagsilent,7
bind=SUPER+CTRL,8,tagsilent,8
bind=SUPER+CTRL,9,tagsilent,9

windowrule=isopensilent:1,tags:4|0,appid:splayer
# ========================== 动画与特效 =========================================
# 窗口特效
## 模糊
blur=1
blur_optimized=1
blur_params_num_passes=4
blur_params_radius=4
blur_params_noise=0.03
blur_params_brightness=0.8
blur_params_contrast=0.8
blur_params_saturation=1.4
## 阴影
shadows=1
shadow_only_floating=1

# 动画
# layer_animations=1
animation_type_open=zoom
animation_type_close=fade
layer_animation_type_open=slide
layer_animation_type_close=slide

# 窗口规则
# windowrule=noblur:0,appid:com.mitchellh.ghostty

# ============================ 快捷键 =============================================
# 壁纸切换
# Wallpaper: Next
bind=Super,W,spawn,dms ipc call wallpaper next
# Wallpaper: Previous
bind=Super+Shift,W,spawn,dms ipc call wallpaper prev

# Bar: Toggle Auto-Hide (Primary)
bindc=Super+Alt,b,spawn,dms ipc call bar toggleAutoHide index 0

# ===== 启动应用 =====
# Browser
bind=Super,B,spawn,google-chrome-stable
# Obsidian notes
bind=Super,O,spawn,obsidian

# ================== 窗口管理 ===================
# Center Window
bind=SUPER,C,centerwin
bind=SUPER+ALT,f,togglefloating

# Move windows in floating mode
# 浮动窗口移动
bind=Super+Alt,Up,smartmovewin,up
bind=Super+Alt,Down,smartmovewin,down
bind=Super+Alt,Left,smartmovewin,left
bind=Super+Alt,Right,smartmovewin,right

# Resize windows in tiling mode
# 调整窗口大小
# Resize Right
bind=Super,Equal,resizewin,+20,0
# Resize Left
bind=Super,Minus,resizewin,-20,0
# Resize Down
bind=Super+Shift,Minus,resizewin,0,+20
# Resize Up
bind=Super+Shift,Equal,resizewin,0,-20

# 切换焦点窗口
# Next Window
bind=SUPER,n,switcher,next
bind=SUPER+ALT,n,focusstack,next
# Previous Window
bind=SUPER,p,switcher,prev
bind=SUPER+ALT,p,focusstack,prev

# Toggle Overview
# 热区（移动到屏幕四角自动打开/关闭 overview）
enable_hotarea=1
hotarea_corner=0 # 0: top-left, 1: top-right, 2: bottom-left, 3: bottom-right
bind=Super,Tab,toggleoverview

#  鼠标绑定
mousebind=SUPER,btn_left,moveresize,curmove # 移动/交换窗口
mousebind=SUPER,btn_right,moveresize,curresize # 调整窗口大小
mousebind=SUPER,btn_middle,togglefloating # 切换浮动状态
# 使用鼠标滚轮切换 tag
# Navigate tags with scroll wheel
axisbind=SUPER+ALT,UP,viewtoleft
axisbind=SUPER+ALT,DOWN,viewtoright
axisbind=SUPER,UP,switcher,prev
axisbind=SUPER,DOWN,switcher,next

# 键盘绑定
bind=SUPER,r,reload_config
# Toggle global state
bind=SUPER,g,toggleglobal # pin on screen

# ================== windowrule ==================
# pot-desktop 翻译弹窗
windowrule=isfloating:1,appid:pot
# =================== Layout =====================
new_is_master=0 # 新窗口放后面（默认是放前面）

# 主次 tile right_tile center_tile
bind=Super+ALT,T,setlayout,tile
bind=Super+ALT+Shift,T,setlayout,right_tile
bind=Super+CTRL,T,setlayout,center_tile
## 布局轮换
circle_layout=tile,center_tile,right_tile
bind=SUPER+ALT,t,switch_layout

## 卷轴
scroller_prefer_center=1
scroller_default_proportion=0.5
bind=SUPER+ALT,s,setlayout,scroller
bind=SUPER+ALT+SHIFT,s,setlayout,vertical_scroller

## 堆叠
bind=SUPER+ALT,d,setlayout,deck
bind=SUPER+ALT+SHIFT,d,setlayout,vertical_deck

# =============================== Scratchpad（最小化） =====================================
# default scratchpad
# 只显示一个 scratchpad 的窗口
single_scratchpad=0
# 临时窗口（default scratchpad）
bind=SUPER,z,toggle_scratchpad # Toggle (show/hide) the scratchpad
bind=SUPER,i,minimized # Send current window to scratchpad
bind=SUPER+SHIFT,i,restore_minimized # Retrieve window from scratchpad (restore)

# named scratchpad（利用窗口规则，把符合窗口规则的设置为命名 scratchpad）
# 快捷终端
# 1. Match by title
windowrule=isnamedscratchpad:1,isterm=1,width:1000,height:700,title:kitty-scratch
# 2. Match by title: launch 'kitty' with window title 'kitty-scratch'
bind=SUPER,t,toggle_named_scratchpad,none,kitty-scratch,kitty -T kitty-scratch

# # 特殊工作区 >0.16.3
# # Toggle the special workspace overlay (Tag 0)
# bind=SUPER,s,toggle_special_tag
# # Move focused window to/from the special workspace
# bind=SUPER+SHIFT,s,tag_special_tag
# # Silently send active window to the special workspace without switching
# bind=SUPER+CTRL,s,tag_special_silent

# ==================================== Keymodes ===============================
# bind[flags]=MODIFIERS,KEY,COMMAND,PARAMETERS
#   p: Pass key event to client.
# 不同模式下的快捷键是互不干扰的（就像 vim 中各个模式，相同快捷键但代表不同功能）


# 全局模式（在所有模式下都生效）
keymode=common
bind=SUPER+ALT,A,setkeymode,app      # 启动应用
bind=SUPER+ALT,R,setkeymode,resize   # 调整（浮动）窗口大小
bind=SUPER+ALT,M,setkeymode,move     # 移动（浮动）窗口
bind=SUPER+ALT,E,setkeymode,exchange # 交换窗口位置
bind=SUPER+ALT,L,setkeymode,layout   # 切换平铺布局
bind=SUPER+ALT,C,setkeymode,view     # 组合视图（comboview）
bind=SUPER+ALT,V,setkeymode,view     # 切换视图（tag）
bindp=CTRL,code:34,setkeymode,default # Ctrl + [
bind=SUPER,Escape,setkeymode,default

# 启动应用
keymode=app
bind=NONE,Escape,killclient
bind=NONE,T,spawn,ghostty
bind=NONE,B,spawn,google-chrome-stable
bind=NONE,G,spawn,google-chrome-stable
bind=NONE,O,spawn,obsidian
bind=NONE,C,spawn,code
bind=NONE,P,spawn,pot # pot-desktop ai translate app

# 切换视图（tag）
keymode=view
bind=NONE,f,togglefloating
bind=NONE,code:21,incnmaster,+1 # =
bind=NONE,code:20,incnmaster,-1 # -
bind=NONE,0,view,0
bind=NONE,1,comboview,1
bind=NONE,2,comboview,2
bind=NONE,3,comboview,3
bind=NONE,4,comboview,4
bind=NONE,5,comboview,5
bind=NONE,6,comboview,6
bind=NONE,7,comboview,7
bind=NONE,8,comboview,8
bind=NONE,9,comboview,9
bind=NONE,h,viewtoleft
bind=NONE,j,viewtoright
bind=NONE,k,viewtoleft
bind=NONE,l,viewtoright
bind=SUPER,1,toggletag,1
bind=SUPER,2,toggletag,2
bind=SUPER,3,toggletag,3
bind=SUPER,4,toggletag,4
bind=SUPER,5,toggletag,5
bind=SUPER,6,toggletag,6
bind=SUPER,7,toggletag,7
bind=SUPER,8,toggletag,8
bind=SUPER,9,toggletag,9
# 移动到 tag，但不切换焦点
bind=ALT,1,tagsilent,1
bind=ALT,2,tagsilent,2
bind=ALT,3,tagsilent,3
bind=ALT,4,tagsilent,4
bind=ALT,5,tagsilent,5
bind=ALT,6,tagsilent,6
bind=ALT,7,tagsilent,7
bind=ALT,8,tagsilent,8
bind=ALT,9,tagsilent,9
# 移动并切换焦点到 tag
bind=CTRL,1,tag,1
bind=CTRL,2,tag,2
bind=CTRL,3,tag,3
bind=CTRL,4,tag,4
bind=CTRL,5,tag,5
bind=CTRL,6,tag,6
bind=CTRL,7,tag,7
bind=CTRL,8,tag,8
bind=CTRL,9,tag,9

# 切换布局
keymode=layout
bind=NONE,t,setlayout,tile
bind=SHIFT,t,setlayout,right_tile
bind=CTRL,t,setlayout,center_tile
bind=NONE,s,setlayout,scroller
bind=SHIFT,s,setlayout,vertical_scroller
bind=NONE,g,setlayout,grid
bind=SHIFT,g,setlayout,vertical_grid
bind=NONE,d,setlayout,deck
bind=SHIFT,d,setlayout,vertical_deck
bind=NONE,w,setlayout,dwindle
bind=NONE,f,setlayout,fair
bind=SHIFT,f,setlayout,vertical_fair
bind=NONE,m,setlayout,monocle

# 交换窗口位置
keymode=exchange
bind=NONE,f,togglefloating
bind=NONE,H,exchange_client,left
bind=NONE,L,exchange_client,right
bind=NONE,K,exchange_client,up
bind=NONE,J,exchange_client,down

# 调整（浮动）窗口大小
keymode=resize
bind=NONE,f,togglefloating
bind=NONE,H,resizewin,-20,0
bind=NONE,L,resizewin,+20,0
bind=NONE,K,resizewin,0,-20
bind=NONE,J,resizewin,0,+20

# 移动（浮动）窗口
keymode=move
bind=NONE,f,togglefloating
bind=NONE,Left,smartmovewin,left
bind=NONE,Right,smartmovewin,right
bind=NONE,Up,smartmovewin,up
bind=NONE,Down,smartmovewin,down
bind=NONE,H,exchange_client,left
bind=NONE,L,exchange_client,right
bind=NONE,K,exchange_client,up
bind=NONE,J,exchange_client,down

